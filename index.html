<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#00005e">
<title>Pride Basketball Stats</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<meta name="apple-mobile-web-app-title" content="Pride Stats">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Henderson Collegiate Pride basketball stat tracker">
<style>
:root{
  --bg:#f3f4f9;--p1:#ffffff;--p2:#eef0f7;--p3:#e6e9f4;--hair:#e3e6f0;--hair2:#ccd1e2;
  --ink:#0b0d2a;--mute:#5d6285;--dim:#9297b6;
  --gold:#FFC72C;--hh:#9a6700;--acc:#0000a8;--navy:#00005e;--sel:#fff5d1;
  --us:#3d4fd6;--opp:#d98200;
  --pos:#12804a;--neg:#d32f2f;--hot:#e0600f;
  --floor:#fbfbfe;--line:rgba(30,36,110,.42);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
body{background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px;background-attachment:fixed}
body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at 50% 0%,rgba(243,244,249,.35),rgba(243,244,249,.9) 65%);pointer-events:none;z-index:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;border-radius:0}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* ---------- header ---------- */
header#top{position:-webkit-sticky;position:sticky;top:0;z-index:20;display:flex;align-items:stretch;background:var(--navy);border-bottom:3px solid var(--gold);color:#fff;padding-top:env(safe-area-inset-top)}
.brandbox{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 12px;border-right:1px solid rgba(255,255,255,.14)}
#logo{height:36px;width:auto}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:12px;letter-spacing:.14em;font-weight:800}
.brand span{font-family:var(--mono);font-size:10px;color:#FFC72C;letter-spacing:.18em}
#tabs{display:flex;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{padding:0 18px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#b8bbe8;border-right:1px solid rgba(255,255,255,.1);position:relative;white-space:nowrap;min-height:52px}
#tabs button.on{color:#fff;background:rgba(255,255,255,.1)}
#tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:#fff}
#sync{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 14px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:#b8bbe8;text-transform:uppercase;border-left:1px solid rgba(255,255,255,.1)}
#sync i{width:6px;height:6px;background:#6d71a8;display:inline-block}
#sync.ok i{background:#3ecf8e}#sync.busy i{background:var(--gold)}#sync.warn i{background:#ff8a3d}
main{position:relative;z-index:1;padding:14px;max-width:1440px;margin:0 auto}
/* ---------- primitives ---------- */
.pn{background:var(--p1);border:1px solid var(--hair2);margin-bottom:14px;position:relative}
.ph{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--hair);min-height:46px;flex-wrap:wrap}
.ph .t{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.ph .t b{color:var(--acc);font-weight:500;margin-right:8px}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb{padding:14px}
.pn.flush .pb{padding:0}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:4px 0 14px;display:flex;align-items:baseline;gap:12px}
h1 small{font-family:var(--mono);font-size:12px;color:var(--mute);font-weight:400;letter-spacing:.06em}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border:1px solid var(--hair2);background:var(--p1);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:2px}
.b:active{background:var(--p3)}
.b.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.b.dng{color:var(--neg);border-color:rgba(255,100,100,.35);background:transparent}
.b.gh{background:transparent}
.b.sm{min-height:34px;padding:0 12px;font-size:11px}
.seg{display:inline-flex;border:1px solid var(--hair2)}
.seg button{padding:0 12px;min-height:32px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);border-right:1px solid var(--hair2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.sel{background:var(--p2);border:1px solid var(--hair2);padding:0 10px;min-height:34px;font-family:var(--mono);font-size:12px;border-radius:0;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
label.f{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
label.f input,label.f select{padding:0 12px;min-height:46px;border:1px solid var(--hair2);background:var(--bg);font-family:var(--sans);font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink);border-radius:0}
label.f input:focus,.cellin:focus{outline:2px solid var(--acc);outline-offset:-1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mute{color:var(--mute)}
.note{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.6;letter-spacing:.02em}
.empty{padding:48px 16px;text-align:center;color:var(--mute)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.g2>.pn{margin-bottom:0}
.g2{margin-bottom:14px}
.g32{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.g32>.pn{margin-bottom:0}
/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--hair2);background:var(--p1);margin-bottom:14px}
.kpi{padding:12px 14px;border-right:1px solid var(--hair)}
.kpi:last-child{border-right:0}
.kpi .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:500;margin-top:4px;letter-spacing:-.02em}
.kpi .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}
.kpi.hl .v{color:var(--acc)}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.st{border-collapse:collapse;width:100%;font-size:13px}
table.st th{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:right;padding:9px 8px;border-bottom:1px solid var(--hair2);white-space:nowrap;background:var(--p1)}
.tw.scroll th{position:sticky;top:0;z-index:1}
table.st td{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding:9px 8px;border-bottom:1px solid var(--hair);white-space:nowrap}
table.st td.n,table.st th.n{text-align:left;font-family:var(--sans)}
table.st td.n{font-weight:600}
table.st td.j{color:var(--dim);width:34px}
table.st tr:hover td{background:rgba(0,0,60,.025)}
table.st tr.tot td{border-top:1px solid var(--hair2);color:var(--ink);font-weight:700;background:var(--p2)}
table.st tr.tot.o td{color:var(--mute)}
.ls table.st td,.ls table.st th{font-size:18px;padding:10px 16px;text-align:center}
.ls table.st th{font-size:12px}
.ls table.st td.n,.ls table.st th.n{text-align:left;font-size:16px;font-weight:700;width:40%}
.ls table.st tr:last-child td{border-bottom:0}
table.st .hh{color:var(--hh)}
table.st th.hh{color:var(--hh)}
.bar{position:relative;display:inline-block;width:64px;height:6px;background:var(--hair);vertical-align:middle;margin-left:8px}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
/* games */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.gc{background:var(--p1);border:1px solid var(--hair2);display:flex;flex-direction:column}
.gc .gt{display:flex;justify-content:space-between;align-items:flex-start;padding:14px;border-bottom:1px solid var(--hair)}
.gc .op{font-size:18px;font-weight:800;margin-top:4px}
.gc .meta{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.08em}
.gc .sc{font-family:var(--mono);font-size:24px;text-align:right}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:3px 7px;border:1px solid currentColor;display:inline-block}
.tag.W{color:var(--pos)}.tag.L{color:var(--neg)}.tag.T{color:var(--mute)}.tag.lvt{color:var(--hh)}
.gc .gm{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--hair)}
.gc .gm div{padding:8px 10px;border-right:1px solid var(--hair);font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.08em}
.gc .gm div:last-child{border-right:0}
.gc .gm b{display:block;font-size:15px;color:var(--ink);font-weight:500;letter-spacing:0;margin-top:2px}
.gc .ga{display:flex;gap:8px;padding:10px 14px}
/* ---------- LIVE ---------- */
.live{display:flex;flex-direction:column;gap:10px;height:calc(100vh - 82px);height:calc(100dvh - 82px)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;background:var(--navy);color:#fff;--hair:rgba(255,255,255,.12);--hair2:rgba(255,255,255,.18);--mute:#b8bbe8;--ink:#fff;--hh:#FFC72C;--p3:rgba(255,255,255,.12)}
.sbt{display:flex;align-items:center;gap:12px;padding:8px 14px}
.sbt.o{justify-content:flex-end}
.sbt img{height:34px}
.sbt .nm{font-size:12px;font-weight:800;letter-spacing:.14em;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbt .tf{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.06em;margin-top:2px}
.sbt .tf b{color:var(--hot);font-weight:500}
.sbt .score{font-family:var(--mono);font-size:44px;font-weight:500;letter-spacing:-.04em;min-width:76px;text-align:center;line-height:1}
.sbt.u .score{color:var(--gold)}
.sbm{border-left:1px solid var(--hair2);border-right:1px solid var(--hair2);display:flex;flex-direction:column}
.per{display:flex}
.per button{min-width:48px;min-height:42px;font-family:var(--mono);font-size:12px;color:var(--mute);border-right:1px solid var(--hair)}
.per button:last-child{border-right:0}
.per button.on{background:var(--gold);color:var(--navy);font-weight:700}
.hhl{border-top:1px solid var(--hair);padding:5px 10px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:440px}
.hhl b{color:var(--hh);font-weight:500}
.quick{display:flex;border:1px solid var(--hair2)}
.quick button{min-width:42px;min-height:40px;font-family:var(--mono);font-size:12px;border-right:1px solid var(--hair2);color:var(--ink)}
.quick button:last-child{border-right:0}
.quick button:active{background:var(--p3)}
.lvg{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr) 280px;gap:10px;min-height:0}
.lvc{display:flex;flex-direction:column;min-height:0;overflow-y:auto;border:1px solid var(--hair2);background:var(--p1)}
.pc{display:grid;grid-template-columns:48px 1fr;align-items:center;text-align:left;border-bottom:1px solid var(--hair);min-height:64px;position:relative}
.pc .nb{font-family:var(--mono);font-size:24px;text-align:center;color:var(--ink)}
.pc .pn2{font-weight:700;font-size:14px;line-height:1.1}
.pc .ps{font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:4px;letter-spacing:.04em}
.pc.on{background:var(--sel)}
.pc.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
.pc.on .nb{color:var(--acc);font-weight:700}
.pc.f4 .ps .pf{color:var(--hot)}.pc.f5{opacity:.5}.pc.f5 .ps .pf{color:var(--neg)}
.pc.oc .nb{font-size:12px;letter-spacing:.1em;color:var(--opp)}
.lvc .subs{margin-top:auto;border-top:1px solid var(--hair2);min-height:52px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.cw{border:1px solid var(--hair2);background:var(--p1);display:flex;flex-direction:column;min-height:0}
.cw .ch{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--hair);min-height:44px}
.cw .hint{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.03em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw .hint b{color:var(--acc);font-weight:500}
.courtbox{flex:1 1 auto;position:relative;min-height:0}
.courtbox>svg{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:manipulation}
.acts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--hair2);background:var(--p1);overflow-y:auto;align-content:start}
.acts h4{grid-column:1/-1;margin:0;padding:7px 12px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--hair);background:var(--bg)}
.ab{min-height:54px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 12px;text-align:left;font-weight:700;font-size:14px}
.ab:nth-of-type(even){border-right:0}
.ab small{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--hh);margin-top:2px;letter-spacing:.04em}
.ab.ok{color:var(--pos)}.ab.no{color:var(--neg)}
.ab.hu{background:rgba(255,199,44,.18)}
.ab.hu small{color:var(--hh)}
.ab.w{grid-column:1/-1;border-right:0}
.ab:active,.pc:active,.quick button:active{background:var(--p3)}
.lvl{display:flex;align-items:stretch;border:1px solid var(--hair2);background:var(--p1);min-height:50px}
.lvl .undo{min-width:100px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;background:var(--acc);color:#fff;font-weight:700}
.lvl .log{display:flex;flex:1;overflow-x:auto;min-width:0}
.chip{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-right:1px solid var(--hair);white-space:nowrap;font-size:12px}
.chip .pq{font-family:var(--mono);font-size:10px;color:var(--dim)}
.chip.o{color:var(--opp)}
.chip button{width:28px;height:28px;color:var(--dim);font-size:16px}
.lvl .end{border-left:1px solid var(--hair2);padding:0 16px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
/* ---------- modal ---------- */
#modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,12,50,.32);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{background:var(--p1);border:1px solid var(--hair2);width:min(660px,100%);max-height:90vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,60,.22)}
.sheet .sh{padding:14px 16px;border-bottom:1px solid var(--hair);font-weight:700;font-size:16px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sheet .sh .tg{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--mute);font-weight:400;text-transform:uppercase}
.sheet .sh .who{color:var(--acc)}
.sheet .sbd{padding:16px}
.sheet .sf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--hair);position:-webkit-sticky;position:sticky;bottom:0;background:var(--p1)}
.nofg .sheet .sf>*+*{margin-left:8px}
.sec{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.sec:first-child{margin-top:0}
.big2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--hair2)}
.big2 button{min-height:96px;font-size:20px;font-weight:800;letter-spacing:.2em}
.big2 button:first-child{border-right:1px solid var(--hair2);color:var(--pos)}
.big2 button:last-child{color:var(--neg)}
.big2 button:active{background:var(--p3)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));border-top:1px solid var(--hair2);border-left:1px solid var(--hair2)}
.pgrid button{min-height:62px;border-right:1px solid var(--hair2);border-bottom:1px solid var(--hair2);text-align:left;padding:8px 10px;font-weight:600;font-size:13px;line-height:1.2;position:relative}
.pgrid button b{display:block;font-family:var(--mono);font-size:18px;font-weight:500}
.pgrid button.on{background:var(--sel)}
.pgrid button.on::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border:2px solid var(--acc);pointer-events:none}
.pgrid button.on b{color:var(--acc)}
.pgrid button.ob b{color:var(--opp);font-size:12px;letter-spacing:.1em;padding:3px 0}
.pgrid button.nb{color:var(--mute)}
.pgrid button:active{background:var(--p3)}
.pgrid button .x{font-family:var(--mono);font-size:10px;color:var(--mute);font-weight:400;margin-top:3px;display:block}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;border-left:4px solid var(--gold);padding:10px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
.def{cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,168,.08);text-decoration:underline dotted;text-decoration-color:var(--dim);text-underline-offset:3px}
.deftip{position:fixed;z-index:80;max-width:280px;background:var(--navy);color:#fff;padding:10px 12px;border-left:3px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,60,.25);pointer-events:none;font-family:var(--sans);font-size:12.5px;line-height:1.45;letter-spacing:0;text-transform:none;font-weight:400;opacity:0;transition:opacity .12s}
.deftip.show{opacity:1}
.deftip b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gold);margin-bottom:3px;font-weight:500}
.deftip i{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:#b8bbe8;margin-top:5px}
.tip{position:fixed;z-index:70;background:var(--navy);color:#fff;font-family:var(--mono);font-size:11px;padding:6px 9px;pointer-events:none;white-space:pre;line-height:1.5}
/* hard hat */
.hhb{display:flex;align-items:center;gap:18px;padding:14px 18px;background:var(--navy);color:#fff;border-left:6px solid var(--gold);margin-bottom:14px}
.hhb .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold)}
.hhb .nm{font-size:22px;font-weight:800;margin-top:2px}
.hhb .v{font-family:var(--mono);font-size:32px;color:var(--gold);margin-left:auto}
.hhicon{width:42px;height:42px;flex:none}
/* shot chart */
.legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--mute)}
.legend .ramp{width:120px;height:8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.chartbox{padding:10px}
.ratio{position:relative;width:100%;max-width:600px;margin:0 auto}
.ratio::before{content:"";display:block;padding-top:94.19%}
.ratio>svg{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.ratio.tr::before{padding-top:35%}
/* four factors */
.ff{display:grid;grid-template-columns:120px 1fr 1fr;font-family:var(--mono);font-size:12px}
.ff>div{padding:9px 12px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:10px}
.ff .h{color:var(--mute);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.ff .lab{color:var(--mute);font-size:11px}
.ff .m{flex:1;height:4px;background:var(--hair);position:relative}
.ff .m i{position:absolute;left:0;top:0;bottom:0}
.ff .val{width:52px;text-align:right}
.ff .best{color:var(--ink);font-weight:700}
/* ---------- WHITEBOARD ---------- */
.wb{display:grid;grid-template-columns:210px minmax(0,1fr) 210px;gap:10px;height:calc(100vh - 82px);height:calc(100dvh - 82px)}
.wb .col{display:flex;flex-direction:column;border:1px solid var(--hair2);background:var(--p1);overflow-y:auto;min-height:0}
.wb .stage{border:1px solid var(--hair2);background:var(--p1);display:flex;flex-direction:column;min-height:0}
.wbbox{flex:1 1 auto;position:relative;min-height:0}
#wbsvg{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.tool{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:48px;border-bottom:1px solid var(--hair);font-size:13px;font-weight:600;text-align:left;position:relative}
.tool.on{background:var(--sel)}
.tool.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
.tool svg{width:34px;height:18px;flex:none;color:var(--ink)}
.colh{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:9px 14px;border-bottom:1px solid var(--hair);background:var(--bg)}
.sw{display:flex;gap:0;border-bottom:1px solid var(--hair)}
.sw button{flex:1;height:42px;border-right:1px solid var(--hair);position:relative}
.sw button:last-child{border-right:0}
.sw button span{display:block;width:16px;height:16px;margin:auto}
.sw button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--acc)}
.wbtn{min-height:44px;border-bottom:1px solid var(--hair);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:0 14px;color:var(--ink)}
.wbtn:active{background:var(--p3)}
.pl{display:block;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--hair);position:relative}
.pl .nm{font-weight:700;font-size:13px}
.pl .mt{font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:3px;letter-spacing:.06em}
.pl.on{background:var(--sel)}.pl.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
.frames{display:flex;align-items:stretch;border-top:1px solid var(--hair2);min-height:46px}
.frames .fd{min-width:46px;border-right:1px solid var(--hair);font-family:var(--mono);font-size:13px;color:var(--mute)}
.frames .fd.on{background:var(--ink);color:var(--bg)}
.frames .fa{padding:0 14px;border-right:1px solid var(--hair);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.frames .fa.pri{background:var(--acc);color:#fff;margin-left:auto;border-right:0;border-left:1px solid var(--hair)}
.stage .sth{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--hair2);min-height:46px;padding-left:14px}
.stage .sth .nm{font-weight:700;flex:1}
.stage .sth .nm small{font-family:var(--mono);font-size:10px;color:var(--hot);letter-spacing:.1em;margin-left:8px;font-weight:400}
.stage .sth button{align-self:stretch;padding:0 16px;border-left:1px solid var(--hair2);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.stage .sth button.pri{background:var(--acc);color:#fff}
.tok{cursor:grab}

/* games tab (landscape) */
.gwrap{display:grid;grid-template-columns:280px minmax(0,1fr);grid-gap:14px;align-items:start}
.gside .pn{margin-bottom:12px}
.b.big{width:100%;min-height:56px;font-size:13px;margin-bottom:12px}
.srec{display:grid;grid-template-columns:1fr auto;padding:14px 14px 6px}
.srec .k,.livecard .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.srec .v{font-family:var(--mono);font-size:40px;font-weight:500;color:var(--acc);letter-spacing:-.03em;line-height:1.1}
.srec .v.sm{font-size:22px;color:var(--ink);text-align:right;margin-top:8px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--hair)}
.sgrid div{padding:9px 14px;border-bottom:1px solid var(--hair)}
.sgrid div:nth-child(odd){border-right:1px solid var(--hair)}
.sgrid span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--mute)}
.sgrid b{font-family:var(--mono);font-size:17px;font-weight:500}
.livecard{border-left:4px solid var(--gold)}
.lc-op{font-weight:800;font-size:17px;margin-top:6px}
.lc-sc{font-family:var(--mono);font-size:28px;color:var(--acc)}
table.st.gt td{padding:11px 8px}
table.st.mpt td,table.st.mpt th{padding:6px 7px;font-size:12px}
table.st.gt tr.grow{cursor:pointer}
table.st.gt tr.grow:active td{background:var(--sel)}
.acts-cell{white-space:nowrap}
.acts-cell .b{margin-left:6px}
.gmain{min-height:200px}
/* MaxPreps */
pre.mp{background:var(--bg);border:1px solid var(--hair2);padding:10px 12px;font-family:var(--mono);font-size:11.5px;max-height:180px;overflow:auto;margin:0;white-space:pre}
ol.steps{margin:0;padding-left:20px;line-height:1.7;font-size:13.5px}
.warn{border-left:4px solid var(--hot);background:#fff4ec;padding:8px 12px;font-size:13px;margin-bottom:10px}
.mpgrid{display:grid;grid-template-columns:1fr 1fr;grid-gap:8px 12px}
.mpgrid label{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--mute)}
.mpgrid input{width:58%;padding:6px 8px;border:1px solid var(--hair2);background:var(--bg);font-family:var(--mono);font-size:12px;color:var(--ink)}
/* flex-gap fallback for older Safari */
.nofg .row>*+*,.nofg .ph>*+*,.nofg .ph .r>*+*,.nofg h1>*+*,.nofg .ga>*+*,.nofg .sbt>*+*,.nofg .legend>*+*,.nofg .hhb>*+*,.nofg .brandbox>*+*,.nofg .cw .ch>*+*,.nofg .stage .sth>*+*,.nofg .tool>*+*,.nofg .chip>*+*,.nofg #sync>*+*,.nofg .b>*+*,.nofg .sh>*+*{margin-left:10px}
@media (orientation:portrait),(max-width:900px){
  .brand{display:none}
  #sync span{display:none}
  #sync{padding:0 12px}
  #tabs button{padding:0 13px}
  .lvg{grid-template-columns:1fr;grid-template-rows:auto auto auto}
  .lvc.pl5{flex-direction:row;overflow-x:auto}
  .lvc.pl5 .pc{min-width:140px;border-right:1px solid var(--hair);border-bottom:0}
  .lvc .subs{margin-top:0;min-width:110px;border-top:0;border-left:1px solid var(--hair2)}
  .courtbox{flex:none;height:46vh}
  .acts{grid-template-columns:repeat(4,1fr)}
  .ab:nth-of-type(even){border-right:1px solid var(--hair)}
  .live{height:auto}
  .sb{grid-template-columns:1fr 1fr}
  .sbm{grid-column:1/-1;order:3;border:0;border-top:1px solid var(--hair2)}
  .per{justify-content:center}
  .sbt .score{font-size:34px;min-width:50px}
  .sbt .nm{max-width:110px}
  .wb{grid-template-columns:1fr;height:auto}
  .wbbox{flex:none;height:62vh}
  .g2,.g32{grid-template-columns:1fr}
  .gwrap{grid-template-columns:minmax(0,1fr)}
  .mpgrid{grid-template-columns:1fr}
}
</style>
</head>

// diverging around 1.00 points per shot: cold blue -> neutral gray -> hot orange
const C_COLD = [47, 98, 224],
  C_MID = [208, 211, 226],

  return a.map((v, i) => Math.round(v + (b[i] - v) * t));
}

    mid = 1.0,
    hi = 1.5;

    c = lerp(C_COLD, C_MID, t);
  } else {
    const t = Math.max(0, Math.min(1, (pps - mid) / (hi - mid)));

}

  const a = [150, 165, 240],
    b = [61, 79, 214],
    c = [0, 0, 110];
  const col = t < .55 ? lerp(a, b, t / .55) : lerp(b, c, (t - .55) / .45);

    } else if (e.type === 'ft') {

function trendChart(rows) {
  const W = 600,
    H = 210,
    pl = 30,
    pb = 28,
    pt = 8;
  const max = Math.max(10, ...rows.map(r => Math.max(r.us, r.opp)));
  const top = Math.ceil(max / 20) * 20;
  const gw = (W - pl - 4) / rows.length;
  const bw = Math.max(3, Math.min(16, (gw - 10) / 2));
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  const bar = (x, v, c, tip) => {
    const yb = H - pb,
      yt = y(v),
      h = yb - yt;
    if (h <= 0) return '';
    const r = Math.min(3, h, bw / 2),
      x2 = x + bw;
    return `<path d="M${x} ${yb}V${yt + r}Q${x} ${yt} ${x + r} ${yt}H${x2 - r}Q${x2} ${yt} ${x2} ${yt + r}V${yb}Z" fill="${c}" data-tip="${esc(tip)}"/>`;
  };
  let g = '';
  for (let t = 0; t <= top; t += top / 4) g += `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--hair)"/><text x="${pl - 6}" y="${y(t) + 3}" font-size="9" font-family="var(--mono)" fill="var(--dim)" text-anchor="end">${t}</text>`;
  rows.forEach((r, i) => {
    const x = pl + i * gw + (gw - 2 * bw - 2) / 2;
    const lab = `${r.g.date} vs ${oppName(r.g)}\nPride ${r.us} – ${r.opp} · ORtg ${f1(r.ortg)}`;
    g += bar(x, r.us, 'var(--us)', lab) + bar(x + bw + 2, r.opp, 'var(--opp)', lab);
    if (rows.length <= 14) g += `<text x="${x + bw + 1}" y="${H - 10}" font-size="9" font-family="var(--mono)" fill="var(--mute)" text-anchor="middle">${esc(oppName(r.g).slice(0, 5).toUpperCase())}</text>`;
  });
  return `<div class="ratio tr" style="max-width:none"><svg id="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}<line x1="${pl}" x2="${W}" y1="${H - pb}" y2="${H - pb}" stroke="var(--hair2)"/></svg></div>`;
}

function strokePath(s) {

  for (let i = 1; i < pts.length; i++) d += 'L' + pts[i][0] + ' ' + pts[i][1];
  let end = '';
  if (p.length > 1 && s.kind !== 'pen') {
    const a = p[p.length - 1];
    let b = p[Math.max(0, p.length - 4)];
    if (b[0] === a[0] && b[1] === a[1]) b = p[0];
    const ang = Math.atan2(a[1] - b[1], a[0] - b[0]);
    if (s.kind === 'screen') {
      const L = 14,
        px = Math.cos(ang + Math.PI / 2) * L,
        py = Math.sin(ang + Math.PI / 2) * L;
      end = `<path d="M${a[0] + px} ${a[1] + py}L${a[0] - px} ${a[1] - py}" stroke="${s.color}" stroke-width="4.5"/>`;
    } else {
      const L = 15;
      const l1 = [a[0] - L * Math.cos(ang - 0.42), a[1] - L * Math.sin(ang - 0.42)],
        l2 = [a[0] - L * Math.cos(ang + 0.42), a[1] - L * Math.sin(ang + 0.42)];
      end = `<path d="M${l1[0]} ${l1[1]}L${a[0]} ${a[1]}L${l2[0]} ${l2[1]}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="miter"/>`;
    }

function zigzag(p) {

    let t = step - acc;
    while (t <= seg) {
      const x = x0 + (x1 - x0) * t / seg,

        ny = (x1 - x0) / seg;

    document.querySelectorAll('.fd').forEach((b, j) => b.classList.toggle('on', j === i));
    await sleep(700);
    if (!WB.playing) break;
    const a = WB.frames[i].tokens,
      b = WB.frames[i + 1].tokens;
    const t0 = performance.now(),
      dur = 1100;
    await new Promise(res => {
      const step = now => {
        if (!WB.playing) return res();
        const t = Math.min(1, (now - t0) / dur),
          e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const mid = {};
        for (const k of TOKS) if (a[k] && b[k]) mid[k] = [a[k][0] + (b[k][0] - a[k][0]) * e, a[k][1] + (b[k][1] - a[k][1]) * e];
        const g = $('#wbtoks');
        if (g) g.innerHTML = TOKS.map(k => mid[k] ? tokenSVG(k, mid[k]) : '').join('');
        if (t < 1) requestAnimationFrame(step);else res();
      };
      requestAnimationFrame(step);
    });
  }
  if (WB.playing) {
    WB.fi = WB.frames.length - 1;
    await sleep(300);
  }
  WB.playing = false;
  if (tab === 'board') renderBoard();
}

function mulberry(a) {
  return function () {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

      if (x < 2 || x > 498 || y < 2 || y > 468) continue;

  const makeP = (x, y, sk, opp) => {

          const orb = rng() < (off === 'us' ? .31 : .27 * os);
          const rt = orb ? off : def;
